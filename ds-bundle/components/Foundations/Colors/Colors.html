<!-- @dsCard group="Foundations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silk DS — Colors</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; padding:44px 40px; background:#F6F3EC;
    font-family:'SF Pro Text','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; color:#211E17; }
  .ny { font-family:'New York','New York Medium',Georgia,'Times New Roman',serif; font-weight:400;
    font-variant-numeric:tabular-nums lining-nums; font-feature-settings:'tnum' 1,'lnum' 1; }
  h1 { font-size:11px; font-weight:500; letter-spacing:.34em; color:rgba(33,30,23,.62); margin-bottom:30px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr)); gap:20px 18px; max-width:920px; }
  .chip { height:84px; border-radius:16px; }
  .edge { box-shadow:inset 0 0 0 1px rgba(33,30,23,.1); }
  .nm { margin-top:10px; font-size:13px; font-weight:500; letter-spacing:-.005em; color:rgba(33,30,23,.84); }
  .hex { margin-top:2px; font-size:11px; letter-spacing:.03em; color:rgba(33,30,23,.5);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .note { margin-top:36px; max-width:920px; font-size:14.5px; letter-spacing:.005em; color:rgba(33,30,23,.58); }
</style>
</head>
<body>
  <h1>SILK · COLOR</h1>
  <div class="grid">
    <div><div class="chip edge" style="background:#F6F3EC"></div><div class="nm">Warm paper</div><div class="hex">#F6F3EC</div></div>
    <div><div class="chip edge" style="background:#EFE9DB"></div><div class="nm">Unbleached linen</div><div class="hex">#EFE9DB</div></div>
    <div><div class="chip" style="background:#211E17"></div><div class="nm">Warm ink</div><div class="hex">#211E17</div></div>
    <div><div class="chip" style="background:#16130E"></div><div class="nm">Night lacquer</div><div class="hex">#16130E</div></div>
    <div><div class="chip edge" style="background:#D8DCD3"></div><div class="nm">Washed sky</div><div class="hex">#D8DCD3</div></div>
    <div><div class="chip" style="background:#8A9484"></div><div class="nm">Moss</div><div class="hex">#8A9484</div></div>
    <div><div class="chip" style="background:#4A5A50"></div><div class="nm">Pine shadow</div><div class="hex">#4A5A50</div></div>
    <div><div class="chip" style="background:#6E7F8A"></div><div class="nm">Dusk blue</div><div class="hex">#6E7F8A</div></div>
    <div><div class="chip" style="background:#5F8A52"></div><div class="nm">Leaf (pop)</div><div class="hex">#5F8A52</div></div>
    <div><div class="chip" style="background:#4E86B8"></div><div class="nm">Open sky (pop)</div><div class="hex">#4E86B8</div></div>
  </div>
  <p class="note ny">One pop moment per screen — a wall, not wallpaper.</p>
</body>
</html>
