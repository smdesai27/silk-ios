<!-- Silk · ensō symbol set
     Paste this block once per page (it renders nothing), then reference a
     variant with <svg viewBox="0 0 200 200"><use href="#enso-full"/></svg>.

     Every variant shares ONE path `d`. What changes is the stroke-dasharray
     across five stacked strokes of increasing width — that stack is what
     makes it read as a brush stroke that thins as it lifts, rather than a
     progress ring. The 6th stroke is the dry-brush shadow; the 7th is the
     lift-off flick, and it must start tangentially where the stroke ends. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- 100% · the complete circle -->
    <symbol id="enso-full" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.2" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.6" pathLength="100" stroke-dasharray="80 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.0" pathLength="100" stroke-dasharray="58 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.8" pathLength="100" stroke-dasharray="34 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="4.6" pathLength="100" stroke-dasharray="16 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.7" opacity="0.45" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="-31" transform="translate(4 4) scale(0.96)"/>
        <path d="M 146 36 C 139 31.5, 133 28.5, 127 26.5" stroke-width="1.1" opacity="0.85"/>
      </g>
    </symbol>

    <!-- 82% · Mirror. Lift-off leaves tangentially at (180,102), rising up the
         right side; the gap opens over the top-right shoulder. -->
    <symbol id="enso-82" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.2" pathLength="100" stroke-dasharray="82 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.6" pathLength="100" stroke-dasharray="65.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.0" pathLength="100" stroke-dasharray="47.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.8" pathLength="100" stroke-dasharray="28 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="4.6" pathLength="100" stroke-dasharray="13 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.7" opacity="0.45" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="-31" transform="translate(4 4) scale(0.96)"/>
        <path d="M 180.1 102.2 C 179.9 95.2, 179.4 88.2, 178.7 81.3" stroke-width="1.1" opacity="0.85"/>
      </g>
    </symbol>

    <!-- 37% · the stroke has shortened. Lift-off leaves tangentially at
         (40,151) on the lower-left descent. -->
    <symbol id="enso-37" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.2" pathLength="100" stroke-dasharray="37 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.6" pathLength="100" stroke-dasharray="28.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.0" pathLength="100" stroke-dasharray="20 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.8" pathLength="100" stroke-dasharray="11.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="4.6" pathLength="100" stroke-dasharray="5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.7" opacity="0.45" pathLength="100" stroke-dasharray="11 100" stroke-dashoffset="-18" transform="translate(4 4) scale(0.96)"/>
        <path d="M 40 151.1 C 44.8 156.3, 49.9 161.2, 55.1 166" stroke-width="1.1" opacity="0.85"/>
      </g>
    </symbol>

    <!-- Down hours · complete, drawn with a lighter hand (every width reduced). -->
    <symbol id="enso-rest" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="1.8" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.1" pathLength="100" stroke-dasharray="80 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.4" pathLength="100" stroke-dasharray="58 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.9" pathLength="100" stroke-dasharray="34 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.4" pathLength="100" stroke-dasharray="16 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.6" opacity="0.35" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="-31" transform="translate(4 4) scale(0.96)"/>
        <path d="M 146 36 C 139 31.5, 133 28.5, 127 26.5" stroke-width="0.9" opacity="0.8"/>
      </g>
    </symbol>

    <!-- The wordmark / shield mark — the same gesture at 13–15px, drawn with
         three fat strokes because detail disappears at that size. -->
    <symbol id="enso-s" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="14" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="17" pathLength="100" stroke-dasharray="55 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="21" pathLength="100" stroke-dasharray="22 100"/>
      </g>
    </symbol>

    <!-- The mic glyph used in the command bar. -->
    <symbol id="mic" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M 5.5 11.5 a 6.5 6.5 0 0 0 13 0"/>
        <path d="M 12 18 L 12 21"/>
      </g>
    </symbol>

  </defs>
</svg>
