# XcodeGen project spec. Regenerate with: xcodegen generate
#
# NOTE: bundle IDs use a placeholder prefix. Before TestFlight:
#   1. change com.sanildesai → your real org identifier (all four targets + app group)
#   2. request the FamilyControls (Distribution) entitlement for ALL FOUR bundle IDs
# DEVELOPMENT_TEAM is already set below.
name: Silk
options:
  bundleIdPrefix: com.sanildesai
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "85Y5HLW3RN"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SilkCore:
    path: SilkCore

targets:
  Silk:
    type: application
    platform: iOS
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.sanildesai.silk } }
    sources: [Silk, Shared]
    dependencies:
      - package: SilkCore
      - target: SilkMonitor
      - target: SilkShield
      - target: SilkShieldAction
    entitlements:
      path: Silk/Silk.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sanildesai.silk]
    info:
      path: Silk/Info.plist
      properties:
        CFBundleDisplayName: Silk
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Deliberately absent, forever: notification entitlements/usage keys.
        # Mic + speech keys arrive only with Silk's own mic session (not in spine).

  SilkMonitor:
    type: app-extension
    platform: iOS
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.sanildesai.silk.monitor } }
    sources: [SilkMonitor, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkMonitor/SilkMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sanildesai.silk]
    info:
      path: SilkMonitor/Info.plist
      properties:
        CFBundleDisplayName: SilkMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension

  SilkShield:
    type: app-extension
    platform: iOS
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.sanildesai.silk.shield } }
    sources: [SilkShield, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkShield/SilkShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sanildesai.silk]
    info:
      path: SilkShield/Info.plist
      properties:
        CFBundleDisplayName: SilkShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  SilkShieldAction:
    type: app-extension
    platform: iOS
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.sanildesai.silk.shieldaction } }
    sources: [SilkShieldAction, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkShieldAction/SilkShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.sanildesai.silk]
    info:
      path: SilkShieldAction/Info.plist
      properties:
        CFBundleDisplayName: SilkShieldAction
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  SilkUITests:
    type: bundle.ui-testing
    platform: iOS
    # A test bundle brings no plist of its own; without this the build stops
    # at code signing asking for one.
    settings: { base: { GENERATE_INFOPLIST_FILE: YES } }
    sources: [SilkUITests]
    dependencies:
      - target: Silk

schemes:
  Silk:
    build:
      targets: { Silk: all }
    run:
      config: Debug
    test:
      config: Debug
      targets: [SilkUITests]
