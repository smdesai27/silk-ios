# XcodeGen project spec. Regenerate with: xcodegen generate
#
# BUNDLE IDENTITY LIVES IN ONE PLACE: SILK_BUNDLE_PREFIX, below.
# Everything else — all four bundle IDs, the app group, the log subsystem —
# derives from it. To rename, change that one line and regenerate.
#
# One door closes permanently and one already has:
#   - bundle IDs lock at the FIRST build upload to App Store Connect
#   - the FamilyControls (Distribution) entitlement was granted team-level,
#     not per bundle ID (docs/market/shipping-roadmap.md, 2026-08-17) — one
#     submission covered all four identifiers, so renaming does not cost a
#     re-request there
# Rename before the App Store Connect upload, not after.
name: Silk
options:
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true
  # Matches DEVELOPER_DIR in .github/workflows/ci.yml. Without it, opening the
  # generated project on any Xcode offers to update it to "recommended
  # settings" — this pins the version XcodeGen stamps so it stops asking.
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "85Y5HLW3RN"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES

    # ---- the one line to change ----
    SILK_BUNDLE_PREFIX: com.silkapp
    # --------------------------------
    SILK_APP_GROUP: group.$(SILK_BUNDLE_PREFIX).silk
    SILK_LOG_SUBSYSTEM: $(SILK_BUNDLE_PREFIX).silk

    # NOTE: TARGETED_DEVICE_FAMILY is set per-target, not here — XcodeGen's
    # target presets inject "1,2" at target level and would override a
    # project-level value. iPhone only: shipping universal forces an iPad
    # review pass and iPad screenshots for a wall that doesn't reach the iPad.

  configs:
    # XcodeGen's target presets otherwise inject the legacy "iPhone Developer"
    # into Release too. Development, not Distribution: with automatic signing,
    # pinning Distribution contradicts the style and fails every build and
    # archive outright — Xcode signs archives with Development and re-signs at
    # export. The pin's only job is overriding the legacy preset name.
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Apple Development"
      # Release only: -file-prefix-map remaps debug, coverage and index info as
      # well as #file, so in Debug it costs real debuggability and buys nothing
      # (a Debug binary is never shipped).
      #
      # Modest by design. Swift 6 already makes #file concise, #filePath appears
      # nowhere in the tree, and Release routes DWARF to a separate dSYM — so
      # this is defence in depth, not the thing keeping paths out of the binary.
      # It also does not reach SilkCore: Xcode does not propagate
      # OTHER_SWIFT_FLAGS to Swift Package targets.
      OTHER_SWIFT_FLAGS: -file-prefix-map $(SRCROOT)=/Silk
      # Explicit rather than relying on the default: a shipped Release build
      # has no business being testable, and leaving it implicit is how it
      # quietly stops being true.
      ENABLE_TESTABILITY: NO
      # Release-only: full asset-catalog optimization trades build time for a
      # smaller archive, which is the right side of that trade for a build
      # nobody iterates on.
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

packages:
  SilkCore:
    path: SilkCore

targets:
  Silk:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).silk
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    sources: [Silk, Shared]
    dependencies:
      - package: SilkCore
      - target: SilkMonitor
      - target: SilkShield
      - target: SilkShieldAction
    entitlements:
      path: Silk/Silk.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(SILK_APP_GROUP)]
    info:
      path: Silk/Info.plist
      properties:
        CFBundleDisplayName: Silk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: LaunchGround }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SilkAppGroup: $(SILK_APP_GROUP)
        SilkLogSubsystem: $(SILK_LOG_SUBSYSTEM)
        # No crypto, no network layer. Declaring the exemption here stops App
        # Store Connect gating every single upload behind the manual
        # export-compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
        # Deliberately absent, forever: notification entitlements/usage keys.
        # Mic + speech keys arrive only with Silk's own mic session (not in spine).

  SilkMonitor:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).silk.monitor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    sources: [SilkMonitor, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkMonitor/SilkMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(SILK_APP_GROUP)]
    info:
      path: SilkMonitor/Info.plist
      properties:
        CFBundleDisplayName: SilkMonitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SilkAppGroup: $(SILK_APP_GROUP)
        SilkLogSubsystem: $(SILK_LOG_SUBSYSTEM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MonitorExtension

  SilkShield:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).silk.shield
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    sources: [SilkShield, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkShield/SilkShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(SILK_APP_GROUP)]
    info:
      path: SilkShield/Info.plist
      properties:
        CFBundleDisplayName: SilkShield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SilkAppGroup: $(SILK_APP_GROUP)
        SilkLogSubsystem: $(SILK_LOG_SUBSYSTEM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  SilkShieldAction:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).silk.shieldaction
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    sources: [SilkShieldAction, Shared]
    dependencies:
      - package: SilkCore
    entitlements:
      path: SilkShieldAction/SilkShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(SILK_APP_GROUP)]
    info:
      path: SilkShieldAction/Info.plist
      properties:
        CFBundleDisplayName: SilkShieldAction
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SilkAppGroup: $(SILK_APP_GROUP)
        SilkLogSubsystem: $(SILK_LOG_SUBSYSTEM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  # The app's own logic, without a simulator walk to reach it.
  #
  # Everything in `Silk/` used to be testable only by driving the UI: a walk
  # costs 30–60 seconds, cannot reach a branch that has no pixel, and cannot
  # wait out a two-minute window. `AppModel`'s wait state machine — raise,
  # pause, resume, land, drop — is a few hundred lines of exactly that shape,
  # and this target is how it is checked in milliseconds instead.
  #
  # Hosted by the app rather than a plain logic bundle, because `AppModel`
  # reads the App Group on the way up and `SharedStore` resolves nothing
  # without the entitlement the host carries.
  SilkTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).SilkTests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Silk.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Silk
        BUNDLE_LOADER: $(TEST_HOST)
    sources: [SilkTests]
    dependencies:
      - target: Silk
      - package: SilkCore

  SilkUITests:
    type: bundle.ui-testing
    platform: iOS
    # A test bundle brings no plist of its own; without this the build stops
    # at code signing asking for one.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SILK_BUNDLE_PREFIX).SilkUITests
        TARGETED_DEVICE_FAMILY: "1"
    sources: [SilkUITests]
    dependencies:
      - target: Silk

schemes:
  Silk:
    build:
      targets: { Silk: all }
    run:
      config: Debug
    test:
      config: Debug
      # Unit tests first: they answer in seconds and cover the branches a walk
      # cannot reach, so a red one should not cost five minutes to discover.
      #
      # `parallelizable: false` on BOTH, stated rather than inherited. It is
      # XcodeGen's default and the generated scheme has always carried
      # `parallelizable = "NO"`, so this line changes no output — which is
      # exactly why it is worth writing down. Both targets depend on it, and
      # neither says so anywhere a reader would look:
      #
      #   SilkTests is hosted by the app and every suite starts from
      #   `SharedStore.wipeAll()` against the real App Group. That state is
      #   global to the process, so `.serialized` — which only orders a suite
      #   against ITSELF — is not what keeps a sibling suite's wipe out of the
      #   middle of `WaitTransactionTests`' sleeps. This is.
      #
      #   SilkUITests drives one simulator through one SpringBoard. Two walks
      #   at once fight over the consent alert and the foreground app.
      #
      # A default that is load-bearing and undeclared is a default that gets
      # changed by somebody who has no way to know.
      targets:
        - name: SilkTests
          parallelizable: false
        - name: SilkUITests
          parallelizable: false
