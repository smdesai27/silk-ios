# Re-runs all three suites on every pull request and every push to main, so the
# spine's tests, the app's own unit tests and the simulator walks stop depending
# on someone remembering to run them. Counts are deliberately not written here:
# they moved every time the tree grew and the comment was wrong more often than
# it was right. `scripts/ci.sh` runs the same three locally.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch retires the first run. This repo is private,
# where macOS runners bill at ten times the Linux rate, and a superseded commit
# has nothing left to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned rather than left to the image's default, which moves without notice.
  # 26.6 is what the tree is developed against; the macos-26 image also carries
  # 26.0.1 through 26.5, so this path is a promise the image keeps.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # The spine again, on Linux, in parallel with the macOS job below and gating
  # nothing. Two different questions are being asked here and only one of them
  # is about the product.
  #
  # SilkCore imports Foundation and nothing else — no UIKit, no SwiftUI, and not
  # one `#if os(...)` in sixteen thousand lines — so it builds and tests on a
  # plain swift.org toolchain. That is worth a runner because it is the property
  # that lets 438 of this repo's 490 test cases run somewhere that is not a Mac:
  # a container, a Linux runner, a cloud session with no Xcode in it. This job is
  # what keeps that true. The day someone reaches into UIKit from the spine for
  # one convenience, this is the thing that says no — on a runner that bills at
  # a tenth of the ones below it.
  #
  # It deliberately does not gate `simulator`. Silk ships to iOS, Darwin's
  # Foundation is the one the product actually runs against, and Linux-green is
  # a developer-velocity property rather than a correctness one. A portability
  # break should name whoever broke it; it should not stop the iOS suites from
  # answering.
  #
  # The image is pinned for the same reason DEVELOPER_DIR is: a bare `swift` tag
  # moves without notice. Bump it when the toolchain the tree is developed
  # against moves past it. Noble is Ubuntu 24.04 — the same floor the spine is
  # expected to run on elsewhere.
  spine-linux:
    name: SilkCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      # Package.swift declares platforms: [.iOS, .macOS]. That array sets minimum
      # deployment targets for Apple platforms and is ignored everywhere else, so
      # it neither helps nor blocks here — the package builds on Linux or it does
      # not, purely on the strength of what it imports.
      - name: swift test
        working-directory: SilkCore
        run: swift test

  # The spine needs no simulator and no signing — it is a plain SwiftPM package
  # that builds for macOS, so it answers in a couple of minutes and answers
  # first.
  spine:
    name: SilkCore
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Package.swift declares .macOS("26.0"); the macos-26 image is 26.5, so
      # the test binary both builds and launches here. A macos-15 runner would
      # compile it and then refuse to run it.
      - name: swift test
        working-directory: SilkCore
        run: swift test

  # Silk.xcodeproj is committed (project.pbxproj, the workspace, and the shared
  # Silk scheme are all tracked), so there is no xcodegen step — CI builds the
  # same project file a fresh clone opens. If project.yml is edited without
  # regenerating, that drift ships in the commit; CI reflects the tree, it does
  # not repair it.
  simulator:
    name: SilkTests + SilkUITests
    runs-on: macos-26
    # The same short-circuit scripts/ci.sh makes locally, and for the same
    # reason plus a bill: a red spine already refuses the PR, and thirteen
    # minutes of simulator at the 10x macOS rate cannot change that answer.
    needs: spine
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      # Two things in this command are load-bearing:
      #
      # OS=latest — the image ships iOS 26.2, 26.4 and 26.5 runtimes and builds
      # an iPhone 17 Pro against more than one of them. The deployment target is
      # 26.5, so a bare `name=iPhone 17 Pro` can resolve to the 26.4 device and
      # fail at install with a deployment-target error rather than a test
      # failure. `latest` always clears the floor.
      #
      # CODE_SIGNING_ALLOWED=NO — project.yml sets DEVELOPMENT_TEAM for device
      # builds, and no runner holds that team's credentials. The simulator
      # installs unsigned bundles happily; this is the same flag the README's
      # simulator build already uses.
      #
      # The app's own logic runs first, and in this job rather than on a third
      # runner: it needs exactly the build the walks need, so sharing
      # DerivedData pays for that build once. It goes first because it answers
      # in about a minute and reaches the branches a walk cannot reach at all —
      # `AppModel`'s wait state machine, whose windows are minutes long and
      # whose failure modes have no pixel.
      #
      # Deliberately no -retry-tests-on-failure on this step. The retry on the
      # walks below is for a shared host wedging a simulator; a unit test that
      # only passes sometimes is a bug in the test, and hiding that is the one
      # thing the flag must not do.
      - name: xcodebuild test — SilkTests
        run: |
          xcodebuild test \
            -project Silk.xcodeproj \
            -scheme Silk \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:SilkTests \
            -derivedDataPath DerivedData/ci \
            -resultBundlePath SilkTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # -retry-tests-on-failure is the backstop, not the fix. The races that
      # made this suite flaky were fixed in the tests themselves — a swallowed
      # tap is asked again, the app is put down rather than killed — and the
      # waits are sized for a slow shared host. This catches what is left:
      # a runner wedged by something no test can see, on a suite whose failures
      # cost thirteen minutes to re-litigate by hand.
      #
      # A retried test still reports as a failure if it fails twice, and the
      # result bundle records that a retry happened, so a test that only ever
      # passes on the second attempt stays visible rather than quietly green.
      # If that shows up, it is a bug to fix here, not a number to raise.
      - name: xcodebuild test — SilkUITests
        run: |
          xcodebuild test \
            -project Silk.xcodeproj \
            -scheme Silk \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:SilkUITests \
            -derivedDataPath DerivedData/ci \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath SilkUITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # A failed UI walk is close to unreadable from the log alone. The result
      # bundle carries the screenshots and the failing step. Both bundles are
      # collected with `if-no-files-found: ignore`, because a unit failure ends
      # the job before the walks ever write theirs.
      - name: Result bundles
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults
          path: |
            SilkTests.xcresult
            SilkUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Everything above pins Debug — the shared scheme does, and neither test
  # invocation passes -configuration. Without this job the Release-only settings
  # are first exercised by an App Store archive, which is the worst place to
  # learn one is wrong: CODE_SIGN_IDENTITY = Apple Distribution, the Release-only
  # -file-prefix-map, wholemodule -O, and every `#if DEBUG` block, which compiles
  # *out* here and nowhere else.
  #
  # Build, not test: the suites already ran under Debug. The only question is
  # whether Release still compiles and links. No simulator, no signing.
  release:
    name: Release build
    runs-on: macos-26
    # Same short-circuit and same reason as `simulator`: a red walk already
    # refuses the PR, and this cannot change that answer.
    needs: simulator
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version

      - name: xcodebuild build — Release
        run: |
          xcodebuild build \
            -project Silk.xcodeproj \
            -scheme Silk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData/release \
            CODE_SIGNING_ALLOWED=NO
