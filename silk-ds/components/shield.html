<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silk DS — Shield</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; padding:44px 40px; background:#F6F3EC;
    font-family:'SF Pro Text','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; color:#211E17; }
  .ny { font-family:'New York','New York Medium',Georgia,'Times New Roman',serif; font-weight:400;
    font-variant-numeric:tabular-nums lining-nums; font-feature-settings:'tnum' 1,'lnum' 1; }
  h1 { font-size:11px; font-weight:500; letter-spacing:.34em; color:rgba(33,30,23,.62); margin-bottom:30px; }
  .rowset { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; }
  .screen { position:relative; width:280px; height:420px; border-radius:24px; overflow:hidden; background:#F6F3EC;
    box-shadow:inset 0 0 0 1px rgba(33,30,23,.08); }
  .screen.night { background:#16130E; box-shadow:none; }
  .cap { margin-top:10px; font-size:12.5px; letter-spacing:.015em; color:rgba(33,30,23,.52); }

  /* ---------- shield (verbatim from canonical) ---------- */
  .shield { position:absolute; inset:0; background:rgba(246,243,236,.92); backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; }
  .screen.night .shield { background:rgba(22,19,14,.93); }
  .shield .smark { width:15px; height:15px; color:rgba(33,30,23,.6); margin-bottom:16px; }
  .screen.night .shield .smark { color:rgba(246,243,236,.4); }
  .shield .suntil { font-size:40px; letter-spacing:-.02em; color:#211E17; }
  .screen.night .shield .suntil { color:rgba(246,243,236,.9); }
  .shield .sapp { font-size:13.5px; color:rgba(33,30,23,.5); }
  .screen.night .shield .sapp { color:rgba(246,243,236,.4); }
  .shield .sok { margin-top:30px; padding:11px 44px; border-radius:16px; background:none;
    border:1px solid rgba(33,30,23,.16); font-size:14px; font-weight:500; color:#211E17; cursor:pointer; font-family:inherit; }
  .screen.night .shield .sok { border-color:rgba(246,243,236,.16); color:rgba(246,243,236,.8); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="enso-s" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="14" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="17" pathLength="100" stroke-dasharray="55 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="21" pathLength="100" stroke-dasharray="22 100"/>
      </g>
    </symbol>
  </defs>
</svg>

  <h1>SILK · SHIELD</h1>

  <div class="rowset">
    <div>
      <div class="screen">
        <div class="shield">
          <svg class="smark" viewBox="0 0 200 200"><use href="#enso-s"/></svg>
          <div class="suntil ny">Instagram</div>
          <div class="sapp"></div>
          <button class="sok">OK</button>
        </div>
      </div>
      <div class="cap">Wall — the mark and the name; nothing to argue with</div>
    </div>

    <div>
      <div class="screen">
        <div class="shield">
          <svg class="smark" viewBox="0 0 200 200"><use href="#enso-s"/></svg>
          <div class="suntil ny">Until 5:00</div>
          <div class="sapp">Instagram</div>
          <button class="sok">OK</button>
        </div>
      </div>
      <div class="cap">Ruled — a rule holds this door until its hour</div>
    </div>

    <div>
      <div class="screen night">
        <div class="shield">
          <svg class="smark" viewBox="0 0 200 200"><use href="#enso-s"/></svg>
          <div class="suntil ny">☾ 7:00 AM</div>
          <div class="sapp">Instagram</div>
          <button class="sok">OK</button>
        </div>
      </div>
      <div class="cap">Down hours — the night answers, not the app</div>
    </div>
  </div>
</body>
</html>
