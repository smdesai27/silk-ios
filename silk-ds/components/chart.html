<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silk DS — Attempts chart</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; padding:44px 40px; background:#F6F3EC;
    font-family:'SF Pro Text','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; color:#211E17; }
  h1 { font-size:11px; font-weight:500; letter-spacing:.34em; color:rgba(33,30,23,.62); margin-bottom:30px; }
  .screen { width:390px; border-radius:20px; padding:2px 0 24px; background:#F6F3EC;
    box-shadow:inset 0 0 0 1px rgba(33,30,23,.08); }
  .cap { margin-top:10px; font-size:12.5px; letter-spacing:.015em; color:rgba(33,30,23,.52); }

  /* ---------- chart (verbatim from canonical) ---------- */
  .chart { margin:44px 46px 0; }
  .chart-title { font-size:12px; letter-spacing:.04em; color:rgba(33,30,23,.48); margin-bottom:16px; }
  .bars { display:flex; align-items:flex-end; height:64px; border-bottom:1px solid rgba(33,30,23,.1); }
  .bars .col, .xlabels .col { flex:1; display:flex; justify-content:center; }
  .bars .bar { width:3px; border-radius:2px 2px 0 0; background:rgba(33,30,23,.28); }
  .bars .col.today .bar { width:5px; background:#5F8A52; }
  .xlabels { display:flex; margin-top:9px; }
  .xlabels .col { font-size:10px; letter-spacing:.02em; color:rgba(33,30,23,.42); }
  .xlabels .col.today { color:rgba(33,30,23,.72); font-weight:500; }

  .screen .chart { margin-top:22px; }
</style>
</head>
<body>
  <h1>SILK · ATTEMPTS CHART</h1>

  <div class="screen">
    <div class="chart">
      <div class="chart-title">Attempts</div>
      <div class="bars">
        <div class="col"><div class="bar" style="height:53px"></div></div>
        <div class="col"><div class="bar" style="height:32px"></div></div>
        <div class="col"><div class="bar" style="height:43px"></div></div>
        <div class="col"><div class="bar" style="height:21px"></div></div>
        <div class="col"><div class="bar" style="height:64px"></div></div>
        <div class="col"><div class="bar" style="height:21px"></div></div>
        <div class="col today"><div class="bar" style="height:11px"></div></div>
      </div>
      <div class="xlabels">
        <div class="col">Tu</div><div class="col">We</div><div class="col">Th</div><div class="col">Fr</div>
        <div class="col">Sa</div><div class="col">Su</div><div class="col today">Today</div>
      </div>
    </div>
  </div>
  <div class="cap">Seven days of attempts — Today carries the pop in leaf</div>
</body>
</html>
