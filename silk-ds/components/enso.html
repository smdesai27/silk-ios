<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .ny { font-family:'New York','New York Medium',Georgia,'Times New Roman',serif; font-weight:400;

  .tile { width:200px; }
  .face { width:200px; height:200px; border-radius:20px; display:flex; align-items:center; justify-content:center; }
  .face.night { background:#16130E; }
  .face svg { width:168px; height:168px; }

</style>

  <h1>SILK · ENSŌ — THE LIVING CIRCLE</h1>

  <div class="rowset">
    <div class="tile">
      <div class="face"><svg viewBox="0 0 200 200" style="color:#5F8A52"><use href="#enso-full"/></svg></div>
      <div class="cap">full · 100% — 40/40, the complete circle</div>
    </div>
    <div class="tile">
      <div class="face"><svg viewBox="0 0 200 200" style="color:#5F8A52"><use href="#enso-37"/></svg></div>
      <div class="cap">37% — the stroke has shortened</div>
    </div>
    <div class="tile">
      <div class="face"><svg viewBox="0 0 200 200" style="color:#211E17"><use href="#enso-82"/></svg></div>
      <div class="cap">82% — Mirror, drawn in ink</div>
    </div>
    <div class="tile">
      <div class="face night"><svg viewBox="0 0 200 200" style="color:#6E7F8A"><use href="#enso-rest"/></svg></div>
      <div class="cap">rest — down hours, a lighter hand</div>
    </div>
  </div>

  <p class="caption ny">The stroke is the budget. No track, no ghost ring — spent time is bare paper.</p>

</html>
