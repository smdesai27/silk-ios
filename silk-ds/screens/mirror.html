<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silk — Mirror</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(1900px 1000px at 50% 38%, #EAE5D8 0%, #E2DBC9 68%, #DCD4C0 100%);
    font-family:'SF Pro Text','SF Pro Display',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; color:#211E17; }
  .ny { font-family:'New York','New York Medium',Georgia,'Times New Roman',serif; font-weight:400;
    font-variant-numeric:tabular-nums lining-nums; font-feature-settings:'tnum' 1,'lnum' 1; }
  .screen { position:relative; width:390px; height:800px; border-radius:46px; overflow:hidden; background:#F6F3EC; }
  .island { position:absolute; top:13px; left:50%; transform:translateX(-50%); width:100px; height:29px;
    border-radius:15px; background:#0D0B08; z-index:6; }
  .home { position:absolute; bottom:9px; left:50%; transform:translateX(-50%); width:128px; height:5px;
    border-radius:3px; background:rgba(33,30,23,.24); z-index:6; }
  .dapple { position:absolute; top:0; left:0; right:0; height:46%; pointer-events:none;
    background:
      radial-gradient(150px 100px at 16% 5%, rgba(240,214,150,.045), transparent 72%),
      radial-gradient(100px 130px at 47% -3%, rgba(238,208,138,.034), transparent 70%),
      radial-gradient(170px 120px at 85% 9%, rgba(236,206,142,.04), transparent 72%),
      radial-gradient(80px 100px at 33% 15%, rgba(150,160,132,.028), transparent 70%); }

  /* ---------- hero / living circle ---------- */
  .enso-wrap { position:relative; }
  .enso-wrap svg.ring { position:absolute; inset:0; width:100%; height:100%; }
  .hero-inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .hero-num { line-height:1; letter-spacing:-.045em; color:#211E17; }
  .hero-label { letter-spacing:.015em; color:rgba(33,30,23,.52); }

  /* ---------- mirror ---------- */
  .m-hero { margin-top:96px; display:flex; justify-content:center; }
  .m-hero .enso-wrap { width:190px; height:190px; }
  .m-hero .enso-wrap svg.ring { color:#211E17; }
  .m-hero .hero-num { font-size:72px; }
  .m-hero .hero-label { margin-top:6px; font-size:12px; }
  .eq { margin-top:22px; text-align:center; font-size:14.5px; letter-spacing:.005em; color:rgba(33,30,23,.58); }
  .chart { margin:44px 46px 0; }
  .chart-title { font-size:12px; letter-spacing:.04em; color:rgba(33,30,23,.48); margin-bottom:16px; }
  .bars { display:flex; align-items:flex-end; height:64px; border-bottom:1px solid rgba(33,30,23,.1); }
  .bars .col, .xlabels .col { flex:1; display:flex; justify-content:center; }
  .bars .bar { width:3px; border-radius:2px 2px 0 0; background:rgba(33,30,23,.28); }
  .bars .col.today .bar { width:5px; background:#5F8A52; }
  .xlabels { display:flex; margin-top:9px; }
  .xlabels .col { font-size:10px; letter-spacing:.02em; color:rgba(33,30,23,.42); }
  .xlabels .col.today { color:rgba(33,30,23,.72); font-weight:500; }
  .card { margin:34px 40px 0; background:#EFE9DB; border-radius:20px; padding:20px 22px 18px; }
  .card .obs { font-size:13.5px; line-height:1.5; color:rgba(33,30,23,.7); }
  .card .ask { margin-top:8px; font-size:17px; line-height:1.35; color:rgba(33,30,23,.92); }
  .card .actions { margin-top:16px; display:flex; align-items:center; gap:10px; }
  .btn-accept { padding:9px 22px; border-radius:999px; background:#211E17; color:#F6F3EC; font-size:13.5px;
    font-weight:500; border:none; font-family:inherit; }
  .btn-later { padding:9px 14px; font-size:13.5px; color:rgba(33,30,23,.5); background:none; border:none; font-family:inherit; }
  .m-footer { position:absolute; left:0; right:0; bottom:110px; text-align:center; font-size:12.5px;
    letter-spacing:.02em; color:rgba(33,30,23,.45); }

  /* ---------- command bar ---------- */
  .cmdbar { position:absolute; left:28px; right:28px; bottom:44px; height:52px; display:flex; align-items:center;
    padding:0 20px; border-radius:26px; background:transparent; border:1px solid rgba(33,30,23,.14); z-index:5; }
  .cmdbar input { flex:1; border:none; outline:none; background:transparent; font-size:15px; letter-spacing:-.005em;
    font-family:inherit; color:#211E17; }
  .cmdbar input::placeholder { color:rgba(33,30,23,.4); }
  .cmdbar .micb { margin-left:12px; width:18px; height:18px; color:rgba(33,30,23,.55); background:none; border:none; padding:0; }
  .dots { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:5; }
  .dot { width:5px; height:5px; border-radius:50%; background:rgba(33,30,23,.16); }
  .dot.active { background:rgba(33,30,23,.6); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="enso-82" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.2" pathLength="100" stroke-dasharray="82 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.6" pathLength="100" stroke-dasharray="65.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.0" pathLength="100" stroke-dasharray="47.5 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.8" pathLength="100" stroke-dasharray="28 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="4.6" pathLength="100" stroke-dasharray="13 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.7" opacity="0.45" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="-31" transform="translate(4 4) scale(0.96)"/>
        <path d="M 180.1 102.2 C 179.9 95.2, 179.4 88.2, 178.7 81.3" stroke-width="1.1" opacity="0.85"/>
      </g>
    </symbol>
    <symbol id="mic" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M 5.5 11.5 a 6.5 6.5 0 0 0 13 0"/>
        <path d="M 12 18 L 12 21"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="screen">
  <div class="dapple"></div>
  <div class="island"></div>

  <div class="m-hero">
    <div class="enso-wrap">
      <svg class="ring" viewBox="0 0 200 200"><use href="#enso-82"/></svg>
      <div class="hero-inner">
        <div class="hero-num ny">82</div>
        <div class="hero-label">Sunday</div>
      </div>
    </div>
  </div>

  <div class="eq ny">82 = 100 − 12 attempts − 6 late</div>

  <div class="chart">
    <div class="chart-title">Attempts</div>
    <div class="bars">
      <div class="col"><div class="bar" style="height:53px"></div></div>
      <div class="col"><div class="bar" style="height:32px"></div></div>
      <div class="col"><div class="bar" style="height:43px"></div></div>
      <div class="col"><div class="bar" style="height:21px"></div></div>
      <div class="col"><div class="bar" style="height:64px"></div></div>
      <div class="col"><div class="bar" style="height:21px"></div></div>
      <div class="col today"><div class="bar" style="height:11px"></div></div>
    </div>
    <div class="xlabels">
      <div class="col">Tu</div><div class="col">We</div><div class="col">Th</div><div class="col">Fr</div>
      <div class="col">Sa</div><div class="col">Su</div><div class="col today">Today</div>
    </div>
  </div>

  <div class="card">
    <div class="obs">Most of your Instagram time follows the 9&nbsp;PM pickup.</div>
    <div class="ask ny">Start down hours at 9:30&nbsp;PM?</div>
    <div class="actions">
      <button class="btn-accept">Accept</button>
      <button class="btn-later">Not now</button>
    </div>
  </div>

  <div class="m-footer ny">⚿ 1 · Jul 12</div>

  <div class="cmdbar">
    <input type="text" placeholder="Tell Silk…" autocomplete="off">
    <span class="micb" title="Speak"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#mic"/></svg></span>
  </div>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot active"></span>
  </div>
  <div class="home"></div>
</div>

</body>
</html>
