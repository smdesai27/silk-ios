<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERIFY — Now, rebuilt from styles.css only</title>
<link rel="stylesheet" href="../../ds-bundle/styles.css">
<style>
  /* harness only — lays the two screens side by side */
  body { background: var(--silk-atmosphere-day); display:flex; gap:28px;
         align-items:center; justify-content:center; min-height:100vh; padding:24px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="enso-full" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.2" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="2.6" pathLength="100" stroke-dasharray="80 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.0" pathLength="100" stroke-dasharray="58 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="3.8" pathLength="100" stroke-dasharray="34 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="4.6" pathLength="100" stroke-dasharray="16 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="0.7" opacity="0.45" pathLength="100" stroke-dasharray="14 100" stroke-dashoffset="-31" transform="translate(4 4) scale(0.96)"/>
        <path d="M 146 36 C 139 31.5, 133 28.5, 127 26.5" stroke-width="1.1" opacity="0.85"/>
      </g>
    </symbol>
    <symbol id="enso-s" viewBox="0 0 200 200">
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="14" pathLength="100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="17" pathLength="100" stroke-dasharray="55 100"/>
        <path d="M 86 24 C 55 28, 26 62, 23 100 C 20 140, 54 178, 98 182 C 144 186, 178 148, 180 104 C 182 72, 168 50, 146 36" stroke-width="21" pathLength="100" stroke-dasharray="22 100"/>
      </g>
    </symbol>
    <symbol id="mic" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/>
        <path d="M 5.5 11.5 a 6.5 6.5 0 0 0 13 0"/>
        <path d="M 12 18 L 12 21"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- ============ DAY ============ -->
<div class="silk-screen">
  <div class="silk-dapple"></div>
  <div class="silk-island"></div>

  <div class="silk-wordmark">
    <svg class="silk-wordmark__mark" viewBox="0 0 200 200"><use href="#enso-s"/></svg>
    <span class="silk-wordmark__text">SILK</span>
  </div>
  <div class="silk-greet silk-serif">Good afternoon.</div>

  <div class="silk-hero">
    <div class="silk-enso-wrap">
      <svg viewBox="0 0 200 200"><use href="#enso-full"/></svg>
      <div class="silk-hero-inner">
        <div class="silk-hero-num silk-serif">40</div>
        <div class="silk-hero-label">min left today</div>
      </div>
    </div>
  </div>

  <div class="silk-aperture"><span class="silk-aperture__text silk-serif">☾&nbsp; 10:00 PM – 7:00 AM</span></div>

  <div class="silk-doors">
    <div class="silk-door silk-door--live"><span class="silk-door__name">Instagram</span><span class="silk-door__time silk-serif">&nbsp;· 5:00</span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--live"><span class="silk-door__name">TikTok</span><span class="silk-door__time silk-serif">&nbsp;· 5:00</span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--rest"><span class="silk-door__name">Clash</span><span class="silk-door__time silk-serif"></span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--rest"><span class="silk-door__name">YouTube</span><span class="silk-door__time silk-serif"></span><span class="silk-door__state"></span></div>
  </div>

  <div class="silk-cmdbar">
    <input type="text" placeholder="Tell Silk…" autocomplete="off">
    <span class="silk-cmdbar__mic" title="Speak"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#mic"/></svg></span>
  </div>
  <div class="silk-dots">
    <span class="silk-dot silk-dot--active"></span>
    <span class="silk-dot"></span>
  </div>
  <div class="silk-home"></div>
</div>

<!-- ============ NIGHT ============ -->
<div class="silk-screen silk-night">
  <div class="silk-moonwash"></div>
  <div class="silk-island"></div>

  <div class="silk-wordmark">
    <svg class="silk-wordmark__mark" viewBox="0 0 200 200"><use href="#enso-s"/></svg>
    <span class="silk-wordmark__text">SILK</span>
  </div>
  <div class="silk-greet silk-serif">Good evening.</div>

  <div class="silk-hero">
    <div class="silk-enso-wrap">
      <svg viewBox="0 0 200 200"><use href="#enso-full"/></svg>
      <div class="silk-hero-inner">
        <div class="silk-hero-num silk-serif" style="font-size:80px">☾</div>
        <div class="silk-hero-label">7:00 AM</div>
      </div>
    </div>
  </div>

  <div class="silk-aperture"><span class="silk-aperture__text silk-serif">☾&nbsp; 10:00 PM – 7:00 AM</span></div>

  <div class="silk-doors">
    <div class="silk-door silk-door--live"><span class="silk-door__name">Instagram</span><span class="silk-door__time silk-serif">&nbsp;· 5:00</span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--live"><span class="silk-door__name">TikTok</span><span class="silk-door__time silk-serif">&nbsp;· 5:00</span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--rest"><span class="silk-door__name">Clash</span><span class="silk-door__time silk-serif"></span><span class="silk-door__state"></span></div>
    <div class="silk-door silk-door--rest"><span class="silk-door__name">YouTube</span><span class="silk-door__time silk-serif"></span><span class="silk-door__state"></span></div>
  </div>

  <div class="silk-cmdbar">
    <input type="text" placeholder="Tell Silk…" autocomplete="off">
    <span class="silk-cmdbar__mic" title="Speak"><svg width="18" height="18" viewBox="0 0 24 24"><use href="#mic"/></svg></span>
  </div>
  <div class="silk-dots">
    <span class="silk-dot silk-dot--active"></span>
    <span class="silk-dot"></span>
  </div>
  <div class="silk-home"></div>
</div>

</body>
</html>
